# AgentX Default Configuration
# Copy to config.yaml and customize

debug: false
log_level: "INFO"
data_dir: "data"
skills_dir: "skills"
scripts_dir: "scripts"

# AI Providers - Configure at least one, then set enabled: true
ai_providers:
  - name: "openai"
    type: "openai"
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o"
    temperature: 0.1
    max_tokens: 4096
    enabled: false

  - name: "anthropic"
    type: "anthropic"
    api_key: "${ANTHROPIC_API_KEY}"
    base_url: "https://api.anthropic.com"
    model: "claude-3-5-sonnet-20241022"
    temperature: 0.1
    max_tokens: 4096
    enabled: false

  - name: "ollama"
    type: "ollama"
    base_url: "http://localhost:11434"
    model: "llama3.1:8b"
    temperature: 0.1
    max_tokens: 4096
    enabled: false

  - name: "lmstudio"
    type: "lmstudio"
    base_url: "http://localhost:1234/v1"
    model: "local-model"
    temperature: 0.1
    max_tokens: 4096
    enabled: false

# Model routing
orchestrator_model: "claude-3-5-sonnet-20241022"
skill_model: "claude-3-haiku-20240307"
local_model: "llama3.1:8b"

