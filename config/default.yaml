# Database
database:
  type: "sqlite"
  path: "data/agentx.db"

# Burp Suite integration
burp:
  enabled: false
  host: "127.0.0.1"
  port: 1337
  use_https: false

# MCP (Model Context Protocol) servers - the AI agent calls these as tools.
# 1) Burp: install the "MCP Server" BApp in Burp Suite (Extensions tab), open
#    the MCP server tab, click "Start server" -> SSE endpoint at http://127.0.0.1:9876
# 2) Browser: Playwright MCP (downloads on first run via npx; needs Node.js >= 20)
mcp_servers:
  - name: "burp"
    transport: "sse"
    url: "http://127.0.0.1:9876"
    auto_approve: false
    enabled: false

  - name: "browser"
    transport: "stdio"
    command: "npx"
    args: ["-y", "@playwright/mcp@latest", "--headless"]
    env:
      PLAYWRIGHT_DRIVER_UPDATE: "false"
    auto_approve: false
    enabled: false

# Permission gate: ask = approve sensitive MCP tools inline, auto = never ask,
# yolo = never ask AND run state-changing tools without review (dangerous)
permission_mode: "ask"

# Max plan->act->observe steps in one agent loop turn
max_agent_steps: 20

# Reporting
report_templates_dir: "agentx/reporting/templates"
default_report_format: "markdown"

# Session
session_timeout: 3600
max_concurrent_tasks: 5