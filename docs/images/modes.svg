<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Segoe UI,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1000" height="300" rx="16" fill="#0f172a"/>
<g text-anchor="middle" fill="#e2e8f0">
<rect x="30" y="30" width="290" height="240" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
<text x="175" y="70" font-size="20" font-weight="700">A · Host agent</text><text x="175" y="98" font-size="14" fill="#94a3b8">No API key needed</text>
<text x="175" y="145" font-size="14">Claude Code · OpenCode · Codex</text><text x="175" y="167" font-size="14">Gemini CLI · Copilot · Cursor</text>
<text x="175" y="215" font-size="14" fill="#22d3ee" font-family="Consolas,monospace">agentx install-skills</text>
<rect x="355" y="30" width="290" height="240" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
<text x="500" y="70" font-size="20" font-weight="700">B · Standalone CLI</text><text x="500" y="98" font-size="14" fill="#94a3b8">Your own API key</text>
<text x="500" y="145" font-size="14">OpenAI · Anthropic</text><text x="500" y="167" font-size="14">Ollama (free) · Custom API</text>
<text x="500" y="215" font-size="14" fill="#a78bfa" font-family="Consolas,monospace">agentx chat -t example.com</text>
<rect x="680" y="30" width="290" height="240" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
<text x="825" y="70" font-size="20" font-weight="700">C · TUI</text><text x="825" y="98" font-size="14" fill="#94a3b8">Full-screen terminal UI</text>
<text x="825" y="145" font-size="14">Live status panel</text><text x="825" y="167" font-size="14">Findings table · F1/F2/F3</text>
<text x="825" y="215" font-size="14" fill="#22d3ee" font-family="Consolas,monospace">agentx tui -t example.com</text>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
