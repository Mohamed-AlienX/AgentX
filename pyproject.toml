[project]
name = "agentx"
version = "0.1.0"
description = "AI-powered penetration testing and bug bounty agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pydantic-yaml>=0.1.0",
    "rich>=13.7.0",
    "textual>=0.80.0",
    "httpx>=0.27.0",
    "mcp>=1.2",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "ollama>=0.3.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "sqlite-utils>=3.37.0",
    "aiofiles>=23.2.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
burp = [
    "websockets>=12.0",
]
full = [
    "agentx[dev,burp]",
]

[project.scripts]
agentx = "agentx.cli:app"
agentx-skill-qa = "agentx.skills.qa.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["S101", "S106", "S311", "S603", "S607", "B008", "B027", "E501", "SIM105", "SIM108", "SIM110", "SIM222"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["agentx"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentx*"]

[tool.setuptools.package-data]
agentx = ["ai/prompts/*.md", "reporting/templates/*"]